kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: artur-platform
networking:
  apiServerAddress: 127.0.0.1
  apiServerPort: 6443
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: ClusterConfiguration
        apiServer:
          certSANs:
            - host.docker.internal
    extraPortMappings:
      - containerPort: 30080
        hostPort: 8081
        protocol: TCP
